name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The manifest declares `rust-version = "1.88"`. Every other job above
      # runs rolling `stable`, which cannot prove that claim in either
      # direction: newer compilers accept code 1.88 rejects, and clippy lints
      # drift both ways across releases (this lane was added after
      # `clippy::similar_names` was found firing on 1.88 but not on stable).
      #
      # LINT-ONLY, DELIBERATELY. `--all-targets` still type-checks the test
      # code, so compile coverage of the MSRV claim is complete; only test
      # *execution* is omitted. Running the suite here as well made two
      # order-dependent tests in `tests/cli.rs` fail: they share the HF cache
      # directory and one states in its own comment that the repo "should
      # already be cached from other tests", so they pass only when the
      # harness happens to schedule them favourably. That flake is
      # pre-existing and unrelated to the toolchain -- a second concurrent
      # full-suite run merely lost a race the `test` job won. It can still
      # bite the `test` job on any push. Fix the tests (self-sufficient cache
      # setup plus serialisation), then restore `cargo test` here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Fails the build on any RUSTSEC advisory against a locked dependency.
      - run: cargo audit
