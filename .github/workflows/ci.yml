name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --all-features

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The manifest declares `rust-version = "1.91"`. Every other job above
      # runs rolling `stable`, which cannot prove that claim in either
      # direction: newer compilers accept code 1.91 rejects, and clippy lints
      # drift both ways across releases (this lane was added after
      # `clippy::similar_names` was found firing on 1.88 but not on stable).
      #
      # The floor moved 1.88 -> 1.91 when hf-fm adopted `hf-hub` 1.0, which
      # takes a mandatory `hf-xet` dependency. Note that `cargo`'s own MSRV
      # check UNDER-REPORTS the real floor here: it only knows about declared
      # `rust-version` fields, which pointed at 1.89 (`konst ^0.4` and
      # `redb ^3.1`, reached via `xet-runtime` / `xet-client`). But
      # `xet-core-structures` declares no `rust-version` at all and calls
      # `str::floor_char_boundary`, stable only since 1.91 — so a build at
      # 1.89 or 1.90 fails with E0658 that `cargo` never predicted.
      #
      # THE FLOOR WAS ESTABLISHED BY BISECTION, NOT BY DECLARATION: 1.90
      # fails, 1.91 passes. Re-bisect rather than trusting `cargo` the next
      # time a dependency in this subtree moves.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Fails the build on any RUSTSEC advisory against a locked dependency.
      - run: cargo audit
