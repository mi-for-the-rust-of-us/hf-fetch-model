name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only workflow token: nothing in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: cargo test --locked --all-features

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The manifest declares `rust-version = "1.91"`. Every other job above
      # runs rolling `stable`, which cannot prove that claim in either
      # direction: newer compilers accept code 1.91 rejects, and clippy lints
      # drift both ways across releases (this lane was added after
      # `clippy::similar_names` was found firing on 1.88 but not on stable).
      #
      # The floor moved 1.88 -> 1.91 when hf-fm adopted `hf-hub` 1.0, which
      # takes a mandatory `hf-xet` dependency. Note that `cargo`'s own MSRV
      # check UNDER-REPORTS the real floor here: it only knows about declared
      # `rust-version` fields, which pointed at 1.89 (`konst ^0.4` and
      # `redb ^3.1`, reached via `xet-runtime` / `xet-client`). But
      # `xet-core-structures` declares no `rust-version` at all and calls
      # `str::floor_char_boundary`, stable only since 1.91 — so a build at
      # 1.89 or 1.90 fails with E0658 that `cargo` never predicted.
      #
      # THE FLOOR WAS ESTABLISHED BY BISECTION, NOT BY DECLARATION: 1.90
      # fails, 1.91 passes. Re-bisect rather than trusting `cargo` the next
      # time a dependency in this subtree moves.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1)
        with:
          toolchain: "1.91"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1)
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1ceecae37ba251f3f09906445d948ebfd5c4e06c # cargo-audit
      # Fails the build on any RUSTSEC advisory against a locked dependency.
      - run: cargo audit

  # Dependency supply chain, per `deny.toml`: licences, sources (crates.io
  # only) and bans. RustSec advisories are left to the `audit` job above, which
  # already fails on them (`cargo deny check advisories` still works locally).
  # Build scripts and proc-macros run arbitrary code at build time, so a
  # compromised or yanked dependency is worth failing the build over.
  deny:
    name: "Dependencies (cargo-deny)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
