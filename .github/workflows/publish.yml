name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# SUPPLY-CHAIN POSTURE (see the 2026-03-24 LiteLLM compromise: a long-lived
# registry token, stolen from CI through a compromised GitHub Action, was used
# to publish straight to the registry).
#
#   * No registry secret. `cargo publish` authenticates through crates.io
#     Trusted Publishing: GitHub's OIDC token is exchanged for a crates.io token
#     that lives ~30 minutes and only for this repository + workflow file +
#     `release` environment (as configured on crates.io).
#   * No mutable code in the job. Every third-party action is pinned to a full
#     commit SHA (the tag it came from is in the trailing comment), and the job
#     restores no build cache.
#   * A human in the loop. The `release` environment requires the maintainer's
#     approval before the job starts, so a pushed tag alone cannot publish.
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Only a `v*` tag may publish; a `workflow_dispatch` run must be started
    # from the tag, not a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    # `id-token: write` lets the job request the OIDC token that Trusted
    # Publishing exchanges for a short-lived crates.io token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
          components: clippy, rustfmt

      # No Swatinem/rust-cache here, deliberately. This job runs `cargo
      # publish` (not --dry-run), which packages and verify-builds the crate
      # under `target/package/<name>-<version>/` -- a nested tree with its
      # own `tests/` directory mirroring the real one. rust-cache's post-run
      # cleanup (its trybuild-cache support since v2.7.0) treats that as
      # another crate root and unconditionally opendir()s
      # `tests/trybuild`/`tests/target` under it with no existence check;
      # this crate doesn't use trybuild, so those never exist, and every
      # publish run logs two ENOENT `##[error]` annotations (harmless --
      # caught internally, doesn't fail the step -- but noisy). `ci.yml`
      # never runs `cargo publish`/`cargo package`, so it never creates that
      # nested tree and keeps rust-cache; this job runs once per release, not
      # a hot path, so the caching isn't worth the noise here.

      # Full CI checks before publishing
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Tests (all features)
        run: cargo test --all-features

      - name: Doc check
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Publish, with a token minted for this run only (Trusted Publishing).
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}