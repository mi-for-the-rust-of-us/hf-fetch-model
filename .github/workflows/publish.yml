name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # No Swatinem/rust-cache here, deliberately. This job runs `cargo
      # publish` (not --dry-run), which packages and verify-builds the crate
      # under `target/package/<name>-<version>/` -- a nested tree with its
      # own `tests/` directory mirroring the real one. rust-cache's post-run
      # cleanup (its trybuild-cache support since v2.7.0) treats that as
      # another crate root and unconditionally opendir()s
      # `tests/trybuild`/`tests/target` under it with no existence check;
      # this crate doesn't use trybuild, so those never exist, and every
      # publish run logs two ENOENT `##[error]` annotations (harmless --
      # caught internally, doesn't fail the step -- but noisy). `ci.yml`
      # never runs `cargo publish`/`cargo package`, so it never creates that
      # nested tree and keeps rust-cache; this job runs once per release, not
      # a hot path, so the caching isn't worth the noise here.

      # Full CI checks before publishing
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Tests (all features)
        run: cargo test --all-features

      - name: Doc check
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Publish
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}