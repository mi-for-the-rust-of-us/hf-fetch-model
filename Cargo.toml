[package]
name = "hf-fetch-model"
version = "0.11.5"
edition = "2024"
rust-version = "1.91"
description = "Download, inspect, and compare HuggingFace models from Rust. Multi-connection parallel downloads plus safetensors, NPZ, GGUF, and PyTorch .pth header inspection via HTTP Range. No weight data downloaded."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mi-for-the-rust-of-us/hf-fetch-model"
homepage = "https://github.com/mi-for-the-rust-of-us/hf-fetch-model"
documentation = "https://docs.rs/hf-fetch-model"
keywords = ["huggingface", "download", "model", "machine-learning"]
categories = ["network-programming", "science"]
default-run = "hf-fetch-model"

[features]
default = []
indicatif = ["dep:indicatif"]
cli = ["dep:clap", "dep:tracing-subscriber", "indicatif"]

[dependencies]
# Format-parser features enable anamnesis's metadata parsers for the
# `inspect <repo> file.<ext>` dispatch paths — both the `--cached` path
# (`parse_gguf` / `inspect_npz` / `parse_pth`) and the remote
# `HttpRangeReader` path (`parse_gguf_front_matter_from_reader` /
# `inspect_npz_from_reader` / `parse_pth_front_matter_from_reader`), which
# are gated by the same feature flags. The `bnb` / `gptq`
# / `awq` flags also unlock anamnesis's tensor-name classification for
# those quantization families, so the v0.10.3 Phase C `Format:` / `Size:`
# lines fire on cached BnB / GPTQ / AWQ safetensors (without them the
# tensors classify as `Passthrough` and `detect_scheme` returns
# `Unquantized` — silently no-op for the families the feature targets).
anamnesis = { version = "0.7.7", features = ["gguf", "npz", "pth", "bnb", "gptq", "awq"] }
clap = { version = "4", features = ["derive"], optional = true }
dirs = "6"
fs2 = "0.4"
globset = "0.4"
hf-hub = "1.0"
# `default-features = false` is load-bearing, not cosmetic. hypomnesis
# 0.2.8 made `cli` a default feature so `cargo install hypomnesis` ships
# the `hmn` binary; Cargo unions features across the whole graph, so a
# bare `hypomnesis = "0.2.x"` here force-enables `clap` + `ctrlc` for
# every downstream consumer — including candle-mi, whose own opt-out
# would be silently overridden. hf-fm calls only `device_info` (for
# `inspect --check-gpu`), so it selects the GPU source features it reads
# and nothing else. `pdh` is kept despite `gpu_processes()` being unused
# until v0.13.0's `--check-gpu --processes`: it is Windows-only and
# shares the `windows` crate that `dxgi` already pulls, so it costs
# nothing here.
hypomnesis = { version = "0.2.10", default-features = false, features = [
    "nvml",
    "nvidia-smi-fallback",
    "dxgi",
    "pdh",
    "metal",
] }
indicatif = { version = "0.18", optional = true }
# Already resolved transitively via anamnesis's vendored ZIP handling
# (`cargo tree -i flate2`); promoted to a direct dependency for `peek`'s
# `--gunzip` decoding (`flate2::read::GzDecoder`). Default features (pure
# Rust `miniz_oxide` backend) — no C toolchain dependency.
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[[bin]]
name = "hf-fetch-model"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "hf-fm"
path = "src/bin/main.rs"
required-features = ["cli"]

[[example]]
name = "progress"
required-features = ["indicatif"]

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]` virtual-time tests
# (the `bound_by_total_timeout` budget tests fire instantly on a paused clock).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# `test-helpers` exposes `GpuDeviceInfo::builder()` for synthetic fixtures
# in tests that exercise the fit / miss JSON path. Default-off in runtime.
# The feature list must mirror the runtime entry above (minus nothing, plus
# `test-helpers`): dev-dependencies unify with normal ones in the test build,
# so a bare entry here would re-introduce the `cli` union this crate just
# opted out of.
hypomnesis = { version = "0.2.10", default-features = false, features = [
    "nvml",
    "nvidia-smi-fallback",
    "dxgi",
    "pdh",
    "metal",
    "test-helpers",
] }
# `serde_json` (already a runtime dependency, version-matched and in the
# lockfile) lets CLI tests parse `--json` output and assert its schema and
# invariants rather than substring-matching the rendered text.
serde_json = "1"
# Already transitively present (pulled in by several runtime deps); promoted
# to a direct dev-dependency so `tests/cli.rs` can isolate tests that would
# otherwise race on the shared global HF cache via a per-test `HF_HOME`.
tempfile = "3"
# NOT transitively present — `anamnesis` uses `zip` only as its own dev-
# dependency to build synthetic `.npz` (ZIP) fixtures in its test suite, never
# exposing it downstream. Added here for the same reason, on `src/inspect.rs`
# unit tests that build a minimal in-memory `.npz` archive to exercise
# `anamnesis::inspect_npz_from_reader` (its `NpzInspectInfo`/`NpzTensorInfo`
# became `#[non_exhaustive]` in anamnesis 0.7.6, so hand-constructing them via
# struct literals — the previous approach — no longer compiles). `STORED`
# (uncompressed) entries only, so no compression-backend feature is needed.
zip = { version = "2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"

[lints.clippy]
# Rule 3: No panics
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Rule 7: Exhaustive matching
wildcard_enum_match_arm = "deny"

# Rule 2: Explicit conversions
as_conversions = "warn"

# Rule 9: Prefer iterators
explicit_iter_loop = "warn"
manual_filter_map = "warn"
manual_find_map = "warn"
needless_range_loop = "warn"

# Rule 17: #[must_use]
must_use_candidate = "warn"

# Additional strictness
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Allow noisy pedantic lints
module_name_repetitions = "allow"
too_many_lines = "allow"
# `duration_suboptimal_units` wants `Duration::from_mins(5)` wherever the
# code says `from_secs(300)`. It became visible only when the MSRV moved to
# 1.91 (the release that stabilised `from_mins`), and it fights this crate's
# domain vocabulary: every timeout here is *specified* in seconds — the CLI
# flags are `--timeout-per-file-secs` / `--timeout-total-secs`, and
# `FetchError::Timeout` carries a `seconds` field — so `from_secs` is what
# matches the surface the user types and reads. Most of the 32 sites are
# tests asserting exactly those second-valued flags.
duration_suboptimal_units = "allow"
